# SPDX-License-Identifier: MPL-2.0
name: Julia package tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: julia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia: '1.9.4'
            juliasyntax: '0.4'
          - julia: '1.12.1'
            juliasyntax: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.julia }}
      - name: Test declared Julia and parser compatibility bounds
        env:
          JULIASYNTAX_SERIES: ${{ matrix.juliasyntax }}
        run: >-
          julia --project=. -e 'using Pkg;
          Pkg.add(PackageSpec(name="JuliaSyntax", version=ENV["JULIASYNTAX_SERIES"]));
          Pkg.test()'
